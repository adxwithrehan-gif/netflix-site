<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Streaming Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">MovieFlix</div>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search movies...">
        </div>
    </header>

    <section id="hero" class="hero">
        <div class="hero-content">
            <h1 id="hero-title">Movie Title</h1>
            <p id="hero-overview">Movie overview goes here...</p>
            <button id="hero-watch-btn" class="watch-btn">Play Now</button>
        </div>
    </section>

    <main class="content-container">
        <section class="row-section">
            <h2>Trending Now</h2>
            <div class="movie-row" id="trending-row"></div>
        </section>

        <section class="row-section">
            <h2>Action Movies</h2>
            <div class="movie-row" id="action-row"></div>
        </section>

        <section class="row-section">
            <h2>Horror Movies</h2>
            <div class="movie-row" id="horror-row"></div>
        </section>

        <section class="row-section">
            <h2>Comedy Movies</h2>
            <div class="movie-row" id="comedy-row"></div>
        </section>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <iframe id="modal-video" src="" frameborder="0" allowfullscreen></iframe>
            <h2 id="modal-title"></h2>
            <p id="modal-overview"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
